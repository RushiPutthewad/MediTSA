{% extends 'volunteer_home.html' %}

{% block main %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<div class="card shadow m-2">
    <div class="card-body">
        <h5 class="p-2" style="..."> Create an Account (Volunteer)</h5>
        <div class="container-fluid">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row row-cols-lg-6">
                    <div class="col-sm-6">
                        <div class="form-floating mt-2 mb-3">
                            <input type="text" name="first" class="form-control" id="floatingInput" placeholder="Enter First Name" required patter="[A-Za-z]+" value="{{volunteer.user.first_name}}">
                            <label for="floatingInput">First Name</label>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="form-floating mt-2 mb-3">
                            <input type="text" name="last" class="form-control" id="floatingInput" placeholder="Enter Last Name" required patter="[A-Za-z]+" value="{{volunteer.user.last_name}}">
                            <label for="floatingInput">Last Name</label>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="form-floating mb-3">
                            <input type="email" name="Eamil" class="form-control" id="floatingInput" placeholder="Email Address" value="{{volunteer.user.username}}" readonly>
                            <label for="floatingInput">Email ID</label>
                        </div>
                    </div>

                    <div class="col-sm-6">
                        <div class="form-floating mb-3">
                            <input type="contact" name="contact" class="form-control" id="floatingInput" placeholder="Contact Number" value="{{volunteer.contact}}" required>
                            <label for="floatingInput">Contact</label>
                        </div>
                    </div>
                    
                    <div class="col-sm-6">
                        <div class="mb-3">
                            <label for="formFileMultiple" class="form-label">User Image</label>
                            <input class="form-control" type="file" name="pic" id="formFileMultiple" multiple>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="mb-3">
                            <img src="{{volunteer.userpic.url}}" width="100" height="100">
                        </div>
                    </div>
                    <div class="col-sm-12">
                        <div class="mb-3">
                            <label for="formFileMultiple" class="form-label">ID Proof Image(Aadhar ID, Voter ID, PanCard etc.)</label>
                            <input class="form-control" type="file" name="idpic" id="formFileMultiple" multiple>
                        </div>
                    </div>
                    <div class="col-sm-12">
                        <div class="form-group">
                            <label>Address</label>
                            <textarea name="address" class="form-control" placeholder="Full Address" required>{{volunteer.address}}</textarea>
                        </div>
                    </div>
                    <div class="col-sm-12">
                        <div class="form-group">
                            <label>About Yourself</label>
                            <textarea name="aboutme" class="form-control" placeholder="About Yourself" required>{{volunteer.address}}</textarea>
                        </div>
                    </div>
                </div>
                <input type="submit" value="Submit" class="m-2 px-3 btn btn-primary">
                </div>
            </form>
        </div>
    </div>
</div>

{% if error == "no" %}
<script>
    alert('Signup Successfull');
    window.location=("{% url 'volunter_log' %}");
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert('Something went wrong, Try Again...');
</script>
{% endif %}

{% if error == "not" %}
<script>
    alert('Your login status is pending');
</script>
{% endif %}

{% endblock %}
