<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% comment %} <meta http-equiv="X-UA-Compatible" content="ie=edge"> {% endcomment %}

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Navigation bars</title>
    <link rel="icon" href="/static/img/logo_sv.svg"/>
    <style>
        .cu-margin{
            margin-left: 230px;
          }
        .custom-btn{
            margin-top: 1px;
            margin-left: 220px;
            color: white;
            background-color: transparent;
            border: 2px solid #fff;
            border-radius: 50px;
            padding: 6px 15px;
        }
        .custom-btn:hover{
            color: white;
            background-color: #FA7070;
        }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg fixed-top" style="background-color: rgba(0,0,0,0.5);"><!--sticky-->
        <div class="container-fluid">
              <a class="navbar-brand text-white ms-4 me-4" href="#">
                <img src="/static/img/logo.png" alt="..." width="50" class="me-2" />MediTSA</a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="nav nav-underline mb-2 mb-lg-0">
                  <li class="nav-item cu-margin">
                    <a class="nav-link text-white mx-3" aria-current="page" href="{% url 'home_page' %}">Home</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link text-white mx-3" href="{% url 'home_page' %}">NOG's</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link text-white mx-3" href="{% url 'home_page' %}">About us </a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link text-white mx-3" href="{% url 'cards_3' %}">Login</a>
                  </li>
                  <li class="nav-item">
                    <button class="btn custom-btn" onclick="navigateToExample()">Donate Now</button>
                  </li>
                  <script>function navigateToExample(){
                    window.location.href="{% url 'login_user' %}";}
                  </script>
                </ul>
              </div>
        </div>
      </nav>
    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    -->
  </body>
</html>
