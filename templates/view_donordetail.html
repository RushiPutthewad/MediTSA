{% extends 'ngo_home.html' %}

{% block main %}


<script src="https://cdn.datatables.net/2.0.7/js/dataTables.js"></script>
<script src="https://cdn.datatables.net/buttons/3.0.2/js/dataTables.buttons.js"></script>
<script src="https://cdn.datatables.net/buttons/3.0.2/js/buttons.dataTables.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<script src="https://cdn.datatables.net/buttons/3.0.2/js/buttons.html5.min.js"></script>

<link rel="stylesheet" href="https://cdn.datatables.net/2.0.7/css/dataTables.dataTables.css">
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/3.0.2/css/buttons.dataTables.css">

<script>
    new DataTable('#example', {
        layout: {
            topStart: {
                buttons: ['copyHtml5', 'excelHtml5', 'csvHtml5', 'pdfHtml5']
            }
        }
    });
</script>

<div class="card shadow">
    <div class="card-body">
        <h5 class="p-2" style="border-bottom : 2px solid blue">View Donor Detail</h5>
    <div class="container-fluid">
        <table class="table table-bordered">
            <tr align="center">
                <td colspan="4" style="font-size : 20px ; color:red">Donor Details</td>
            </tr>
            <tr>
                <th>Donor Name</th>
                <td>{{donor.user.first_name}} {{donor.user.last_name}}</td>

                <th>Donor Contact</th>
                <td>{{donor.contact}}</td>
            </tr>
            <tr>
                <th>Email ID</th>
                <td>{{donor.user.username}}</td>

                <th>Donor Image</th>
                <td><img src="{{donor.userpic.url}}" width="50px" height="50px"></td>
            </tr>
            <tr align="center">
                <td colspan="4" style="font-size: 20px">
                    <a href="{% url 'delete_donor' donor.user.id %}" onclick="return confirm('Are you Sure?')" class="text-primary">Delete</a>
                </td>

            </tr><!--26 complete-->
        </table>
    </div>
    </div>
</div>
{% endblock %}
