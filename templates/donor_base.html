{% load static %}
<html lang="en">
<head>
    <title>Donor base</title>
    <!-- temp start-->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>

    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css" integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" crossorigin="anonymous">
    <!--boostraop 5-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
        .sidebar-title{
            letter-spacing: 0.1em;
            color:#aaa;
    
        }
    
        body{
            background-image: linear-gradient(135.9deg,rgba(89,25,252,1) 16.4%,rgba(125,31,165,1) 56.1%);
            min-height: 100vh;
        }
        .vertical-nav{
            min-width: 17rem;
            width: 17rem;
            height: 100vh;
            position: fixed;
            top: 0;
            left:0;
            transition:all 0.4s
        }
        .page-content{
            width: calc(100%-17rem);
            margin-left: 17rem;
            transition:all 0.4s
        }
        
        #content.active{
            width: 100%;
            margin: 0;
        }
    
        #sidebar.active{
            margin-left:-17rem;
        }
        .dashboard-text{
            letter-spacing: 0.1em;
        }
</style></head>

<body>
    <!-- vertical navbar start -->
<div class="bg-white vertical-nav" id="sidebar">
    <div class="py-4 px-3 bg-light mb-1">
        <p class="text-center font-weight-bold text-uppercase px-3 small dashboard-text"> MediTSA </p>
        <div class="media d-flex align-items-center">
            <img src="{{request.user.Donor_set.all.0.userpic.url}}" width="80" height="80" style="margin-right: 10px;" class="mr-3 rounded-circle img-thumbnail shadow-sm">
            
            <div class="media-body">
                <h4 class="mb-0">Donor</h4>
                <p class="text-muted mb-0">{{request.user.email}}</p>
            </div>
        </div>
    </div>

    <ul class="nav flex-column bg-white">
        <li class="nav-item">
            <a href="#" class="nav-link text-dark bg-light"> 
                <i class="fas fa-tachometer-alt fa-fw mr-3 text-primary"></i> 
                Dashboard </a>
        </li>

        <li class="nav-item">
            <a href="{% url 'donate_now_form' %}" class="nav-link text-dark bg-light"> 
                <i class="fa-solid fa-hand-holding-medical fa-fw mr-3 text-primary"></i> 
                Donote now </a>
        </li>
        

        <li class="nav-item">
            <a href="{% url 'donation_history' %}" class="nav-link text-dark bg-light"> 
                <i class="fa-solid fa-hand-holding-medical fa-fw mr-3 text-primary"></i> 
                Donote history </a>
        </li>

        <li class="nav-item dropdown">
            <a href="#" class="nav-link dropdown-toggle text-dark bg-light" data-bs-toggle="dropdown" id="navbardrop" data-toggle="dropdown"> 
                <i class="fas fa-chart-bar fa-fw mr-3 text-primary"></i> 
                Services </a>
                <div class="dropdown-menu">
                    <a class="dropdown-item" href="{% url 'add_service' %}">Add Services</a>
                    <a class="dropdown-item" href="">Manage Services</a>
                </div>
        </li>

        <li class="nav-item">
            <a href="#" class="nav-link text-dark bg-light"> 
                <i class="fas fa-tachometer-alt fa-fw mr-3 text-primary"></i> 
                Dashboard </a>
        </li>

        <li class="nav-item">
            <a href="#" class="nav-link text-dark bg-light"> 
                <i class="fas fa-tachometer-alt fa-fw mr-3 text-primary"></i> 
                Dashboard </a>
        </li>
    </ul>
</div>
<!-- vertical navbar end -->

<!-- content placeolder start -->
<div class="page-content p-4" id="content">
    <a href="{% url 'logout' %}" title="logout" class="text-white float-right">Logout</a>
    <button id="sidebarCollapse" type="button" class="btn btn-light bg-white rounded-pill shadow-sm px-4 mb-4">
        <i class="fas fa-bars mr-2"></i>
        <small class="text-uppercase font-weight-bold">Toggle</small>
    </button>
{% block main %}

{% endblock %}

</div>
