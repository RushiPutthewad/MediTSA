<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  </head>
  <body>

              <img src="/static/img/logo_sv.svg" alt="..." width="50" class="me-2" />MediTSA</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">

<style>
    body{
        background-image: url('/static/img/bg_2-6SrleG7S8-transformed.png');
        background-size: cover;
        background-position: center center;
        background-attachment: fixed;
        height: 100%;
    }
    .form-floating{
      color: black;
    }
    .form-floating label{
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      color: #fff;
      font-size: 16px;
      pointer-events: none;
      transition: 0.15s ease;
    }
    .form-floating input{
      width: 100%;
      height: 40px;
      background: transparent;
      border: none;
      outline: none;
      font-size: 16px;
      color: #fff;
    }
    .form-floating input:focus~label,
    .form-floating input:valid~label {
      font-size: 0.8rem;
      top: 10px;
      transform: translateY(-120%);
    }
    .input-field {
      position: relative;
      border-bottom: 2px solid #ccc;
      margin: 15px 0;
    }
    
    .input-field label {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      color: #fff;
      font-size: 16px;
      pointer-events: none;
      transition: 0.15s ease;
    }
    
    .input-field input {
      width: 100%;
      height: 40px;
      background: transparent;
      border: none;
      outline: none;
      font-size: 16px;
      color: #fff;
    }
    
    .input-field input:focus~label,
    .input-field input:valid~label {
      font-size: 0.8rem;
      top: 10px;
      transform: translateY(-120%);
    }

    .forget {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 25px 0 35px 0;
      color: #fff;
    }
    
    #remember {
      accent-color: #fff;
    }
    
    .forget label {
      display: flex;
      align-items: center;
    }
    
    .forget label p {
      margin-left: 8px;
    }

    .cu-margin{
      margin-left: 230px;
    }
    .custom-btn{
      margin-top: 1px;
      margin-left: 250px;
      color: white;
      background-color: transparent;
      border: 2px solid #fff;
      border-radius: 50px;
      padding: 6px 15px;
    }
    .custom-btn:hover{
        color: white;
        background-color: #FA7070;
    }
</style>
<div class="mx-auto rounded text-white"
style="background-color: rgba(0,0,0,0.5);margin: 60px;backdrop-filter: blur(8px);
-webkit-backdrop-filter: blur(8px);width: 400px;border-radius: 8px;padding: 30px;">
<h3 class="px-3 text-center">Donor Login</h3>
<hr>

<form action="" method="post" class="py-1">
    {% csrf_token %}
    <div class="input-field">
      <input type="text" name="email" required>
      <label>Email address</label>
    </div>
    <div class="input-field">
      <input type="password" name="pass" minlength="8" required>
      <label>Password</label>
    </div>
    

    <div class="forget">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault" name="remember">
        <label class="form-check-label" for="flexCheckDefault">
            Remember Me
        </label>
      </div>
      <a href="#">Forgot password?</a>
    </div>
    
    <div class="d-flex justify-content-center">
      <button class="btn btn-primary" onclick="{% url 'donor_hom' %}" style="width: 100px;">Login</button>
    </div>
</form>
<hr>
<div class="text-center">
    Don't have an account? <a href="{% url 'donor_regi' %}" class="text-white">Register</a><br>
    {% comment %} Bhupedra Jogi donor1234 {% endcomment %}
</div>

</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
{% if error == "no" %}
<script>
    alert('Logged In Successfull');
    window.location=("{% url 'donor_hom' %}");


</script>
{% endif %}
  
{% if error == "yes" %}
<script>
    alert('Something went wrong, Try Again...');


</script>
{% endif %}
