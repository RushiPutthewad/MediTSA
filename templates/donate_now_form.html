{% extends "Donor_home.html" %}

{% block main %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <div class="card shadow">
        <div class="card-body">
            <h5 class="p-2" style="border-bottom : 3px solid rgb(0, 145, 255)">Donate Now</h5>
            <div class="container-fluid">
                <form action="{% url 'donate_now' %}" method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="form-row">
                        <div class="col-sm-10">
                            <div class="form-group">
                            <label>Medicine Name</label>
                            <input type="name" name="medicinename" class="form-control" required>
                            </div>
                        </div>

                        <div class="col-sm-6">
                            <div class="form-group">
                            <label>Tablet Count</label>
                            <input type="number" name="tabCount" class="form-control" required>
                            </div>
                        </div>

                        <div class="col-sm-6">
                            <div class="form-group">
                                <label>Medicine Type</label>
                                <a class="nav-link dropdown-toggle text-dark bg-light" data-bs-toggle="dropdown" id="navbardrop" data-toggle="dropdown"> 
                                </a>
                                <div class="dropdown-menu">
                                    <a class="dropdown-item">Syrup</a>
                                    <a class="dropdown-item">Tablet</a>
                                    <a class="dropdown-item">Injection</a>
                                </div>
                            </div>
                        </div>

                        <div class="col-sm-6">
                            <div class="form-group">
                            <label>Purchased Date</label>
                            <input type="date" name="purchased_date" class="form-control" id="date" required>
                            </div>
                        </div>

                        <div class="col-sm-6">
                            <div class="form-group">
                            <label>Expiry Date</label>
                            <input type="date" name="expiry_date" class="form-control" id="date" required>
                            </div>
                        </div>

                        <div class="col-sm-10">
                            <div class="form-group">
                                <label>Medicine Image </label>
                                <input type="file" name="donationpic" class="form-control" id="formFileMultiple">
                            </div>
                        </div>
                        <div class="col-sm-10">
                            <label>Collect location</label>
                            <textarea name="coll" class="form-control" placeholder="Enter address" required></textarea>
                        </div>
                        <div class="col-sm-10">
                            <label>Description of Medicine </label>
                            <textarea name="description" class="form-control" placeholder="Enter description of medicine" required></textarea>
                        </div>

                    </div>
                    <input type="submit" value="Donate for happiness" class="btn btn-outline-danger px-3 mt-3">
                    <!-- medicine name, Tablet Count, Purchased Date, Expiry Date, Detail -->
                </form>
            </div>
    </div>

    {% if error == "no" %}
    <script>
        alert('Donation Collection Request Has Been Send. We will contact you soon');
        window.location=("{% url 'donation_history' %}");
    </script>
    {% comment %} <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script>swal("Thank you!","Donation Collection Request Has Been Send. We will contact you soon",
        "success");
    window.location=("{% url 'donation_history' %}");</script> {% endcomment %}
    
    {% endif %}

    {% if error == "yes" %}
    <script>
        alert('Something went wrong. Please try again');
        <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
        <script>swal("Info is remaining!","Something went wrong. Please try again",
            "info");</script>
    </script>
    {% endif %}
{% endblock %}
